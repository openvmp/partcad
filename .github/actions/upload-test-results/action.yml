name: Upload Test Results & Coverage Data

description: >
  Upload a job's test results to GitHub, and its raw coverage data under a name
  the "Coverage" job knows how to find.

inputs:
  name:
    description: Name of the artifact to upload to GitHub.
    required: true
    default: test-results
  path:
    description: Path to the test results to upload to GitHub.
    required: true
  retention-days:
    description: Number of days to retain the artifact on GitHub.
    required: false
    default: "7"
  coverage-data:
    description: >
      Path to the raw coverage.py data file this job produced, if it produced
      one. Uploaded separately from the test results so that the merge in the
      "Coverage" job can ask for coverage data and get only coverage data. Leave
      empty in a job that measures nothing.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Upload test results to GitHub
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}

    # Not every cell of every matrix writes one. The behave job traces on the
    # lowest interpreter of each image only (see the note beside PC_BEHAVE_COVERAGE
    # in "test.yml"), and a job that failed before its first test ran has nothing
    # to hand over -- both of which are "no data", not "upload failed".
    #
    # A shell test rather than "hashFiles": the file is called ".coverage", and
    # the glob library behind "hashFiles" does not reliably match a leading dot.
    # Through the environment rather than by interpolating the input into the
    # script, like every other such step in this repository (zizmor
    # template-injection).
    - name: Is there coverage data to upload?
      id: probe
      shell: bash
      env:
        COVERAGE_DATA: ${{ inputs.coverage-data }}
      run: |
        if [ -n "${COVERAGE_DATA}" ] && [ -f "${COVERAGE_DATA}" ]; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        elif [ -z "${COVERAGE_DATA}" ]; then
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "This job measures no coverage."
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "No coverage data at '${COVERAGE_DATA}'."
        fi

    # "coverage-data-" prefixed, because that prefix is the contract: the
    # "Coverage" job downloads "coverage-data-*" and merges whatever arrives, so
    # a new job joins the merged report by uploading under this name and needs no
    # other change anywhere.
    #
    # "include-hidden-files" is load-bearing. A coverage.py data file is called
    # ".coverage", and "upload-artifact" has excluded dotfiles by default since
    # v4.4 -- without this the step succeeds, uploads an empty artifact, and the
    # merge silently loses this job.
    - name: Upload raw coverage data
      if: ${{ steps.probe.outputs.found == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage-data-${{ inputs.name }}
        path: ${{ inputs.coverage-data }}
        include-hidden-files: true
        retention-days: ${{ inputs.retention-days }}
