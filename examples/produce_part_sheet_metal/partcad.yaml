desc: >
  This example demonstrates a part that is made by bending a flat piece of sheet
  metal. One drawing holds both halves of that -- the outline the blank is cut
  to, and the lines it is bent along -- and each half is read out of it by the
  layers the reference asks for.

docs:
  usage: |
    ```shell
    pc inspect blank
    pc inspect bracket
    pc test -f cam-sheet-metal bracket
    ```

    The drawing's bend lines carry their angle, inner radius and direction in
    the file's extended data (XDATA), which `pc test` reads off the sketch:

    ```shell
    pc inspect -s 'panel;include=BEND_UP,BEND_DOWN'
    ```

sketches:
  panel:
    type: dxf
    desc: >
      The drawing, on three layers. `OUTLINE` is the flat pattern; `BEND_UP` and
      `BEND_DOWN` each hold one line, annotated in the file's extended data
      (XDATA) with the angle, the inner radius and the direction of the bend
      along it. Which of the three a reader gets is the `include` parameter's to
      say, so this is one sketch and not three.

parts:
  blank:
    type: extrude
    sketch: panel;include=OUTLINE
    depth: 2
    desc: >
      The flat piece that goes into the brake, extruded from the outline layer
      of the drawing. It is cut flat -- laser, waterjet, punch, router -- so its
      own manufacturing method is `subtractive`: the outline, and any holes and
      cut-outs a real part would have, are made here and not while it is bent.
    manufacturing:
      method: subtractive
    parameters:
      tolerance: 0.1

  bracket:
    type: build123d
    desc: >
      The blank, bent. `source` names what goes into the brake and
      `instructions` the two bend lines of the same drawing, selected by their
      layers. Nothing about the outline is restated here: it belongs to the
      blank, and this declaration is only what the brake does to it.
    manufacturing:
      method: sheet_metal
      source: blank
      instructions: panel;include=BEND_UP,BEND_DOWN
    parameters:
      tolerance: 0.1

render:
  readme:
  svg:
